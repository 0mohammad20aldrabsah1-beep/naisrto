<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>تم الإرسال</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Cairo", sans-serif;
      background: #fff;
      min-height: 100vh;
      max-width: 430px;
      margin: 0 auto;
      color: #222;
      display: flex;
      flex-direction: column;
    }

    .page-header {
      background: #6b2d8a;
      color: #fff;
      padding: 14px 18px;
      font-size: 17px;
      font-weight: 700;
      text-align: right;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
    }

    .icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #e8f5e9;
      color: #2e7d32;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin-bottom: 20px;
    }

    .content p {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.75;
      color: #333;
    }
  </style>
</head>
<body>
  <header class="page-header">تم</header>
  <main class="content">
    <div class="icon" aria-hidden="true">✓</div>
    <p>سيتم التواصل معك من قبل فريق خدمة العملاء خلال 24 ساعة</p>
  </main>
</body>
</html>
